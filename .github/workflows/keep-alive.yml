name: Keep MongoDB Atlas Alive

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch: # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 20 --max-time 30 \
            https://chanu-wars-back.vercel.app/api/health
